name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # pnpm 11 (packageManager) requires Node >= 22.13 for its own runtime;
        # engines.node is ">=22" (the dsh host itself needs 22+), so the
        # lowest supported Node IS covered by this matrix — unlike a ">=20"
        # claim, no separate engines-floor parse job is needed.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      # This repo deliberately has no test framework (see AGENTS.md).
      # client-smoke executes lib/client.js against a stubbed module loader
      # and drives apply() to slot registration — the strongest
      # credential-free behavioral check available in CI. scripts/cli-contract.mjs
      # needs a real Claude CLI plus credentials, so it stays local-only.
      - name: Client bundle smoke
        run: node scripts/client-smoke.mjs

      - name: Pack (tarball manifest check)
        run: pnpm pack --dry-run
